<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tumble remote</title>
    <meta name="theme-color" content="#023047" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      :root { --ink: #023047; --accent: #fb8500; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #023047; color: #fff; font-family: 'Fredoka Variable', system-ui, sans-serif; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
      main { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box; }
      h1 { margin: 0; font-size: 1.4em; text-align: center; }
      #status { text-align: center; font-weight: 600; min-height: 1.3em; opacity: 0.9; }
      button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 18px; background: var(--accent); color: #fff; box-shadow: 0 4px 0 #c96a00; }
      button.secondary { background: #1b5a78; box-shadow: 0 4px 0 #0e3a50; }
      button[hidden] { display: none; }
      #pad { flex: 1; min-height: 0; border-radius: 28px; background: radial-gradient(circle at 50% 80%, #2c7ea1, #0e3a50); border: 3px solid #4fb3d9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; touch-action: none; padding: 16px; font-size: 1.2em; }
      #pad[hidden] { display: none; }
      #pad.active { border-color: var(--accent); }
      #pad .big { font-size: 2.4em; }
      #speed { font-variant-numeric: tabular-nums; font-size: 1.6em; font-weight: 700; min-height: 1.2em; }
      #hint { text-align: center; font-size: 0.9em; opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tumble remote</h1>
      <div id="status">Hold your phone like a wand and point it at the screen.</div>
      <button type="button" id="connect">Connect</button>
      <div id="pad" hidden>
        <div class="big">👆</div>
        <div>Swipe up here to throw</div>
        <div id="speed"></div>
      </div>
      <button type="button" id="center" class="secondary" hidden>Recenter aim</button>
      <div id="hint">Tilt and turn the phone to aim. A faster swipe throws harder.</div>
    </main>
    <script type="module" src="/src/controller.ts"></script>
  </body>
</html>
