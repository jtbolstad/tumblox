<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tumble remote</title>
    <meta name="theme-color" content="#023047" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      :root { --ink: #023047; --accent: #fb8500; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #023047; color: #fff; font-family: 'Fredoka Variable', system-ui, sans-serif; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
      main { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box; }
      h1 { margin: 0; font-size: 1.4em; text-align: center; }
      #status { text-align: center; font-weight: 600; min-height: 1.3em; opacity: 0.9; }
      #turn-banner { text-align: center; font-weight: 800; font-size: 1.1em; padding: 10px 14px; border-radius: 14px; color: #fff; border: 3px solid transparent; }
      #turn-banner[hidden] { display: none; }
      #turn-banner.mine { border-color: #fff; font-size: 1.3em; }
      #turn-banner.theirs { opacity: 0.85; }
      button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 14px 18px; background: var(--accent); color: #fff; box-shadow: 0 4px 0 #c96a00; }
      button.secondary { background: #1b5a78; box-shadow: 0 4px 0 #0e3a50; }
      button[hidden] { display: none; }
      #pad { flex: 1; min-height: 0; border-radius: 28px; background: radial-gradient(circle at 50% 80%, #2c7ea1, #0e3a50); border: 3px solid #4fb3d9; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; touch-action: none; padding: 16px; font-size: 1.2em; }
      #pad[hidden] { display: none; }
      #pad.active { border-color: var(--accent); }
      #pad.waiting { opacity: 0.45; filter: grayscale(0.6); }
      #pad .big { font-size: 2.4em; }
      #speed { font-variant-numeric: tabular-nums; font-size: 1.6em; font-weight: 700; min-height: 1.2em; }
      #bar { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 700; }
      #bar[hidden] { display: none; }
      #level-name { font-size: 1.15em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #throws { white-space: nowrap; opacity: 0.9; }
      #buttons { display: flex; gap: 8px; }
      #buttons button { flex: 1; padding: 12px 8px; }
      #picker { position: fixed; inset: 0; z-index: 10; background: #023047; display: flex; flex-direction: column; gap: 10px; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box; }
      #picker[hidden] { display: none; }
      #picker header { display: flex; justify-content: space-between; align-items: center; }
      #picker h2 { margin: 0; font-size: 1.3em; }
      #level-list { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-content: start; padding-bottom: 8px; }
      #level-list button { text-align: left; padding: 10px 12px; font-weight: 600; background: #1b5a78; box-shadow: 0 3px 0 #0e3a50; display: grid; gap: 2px; }
      #level-list button.current { outline: 3px solid var(--accent); }
      #level-list .n { font-size: 1.1em; font-weight: 800; }
      #hint { text-align: center; font-size: 0.9em; opacity: 0.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tumble remote</h1>
      <div id="turn-banner" hidden></div>
      <div id="bar" hidden><span id="level-name"></span><span id="throws"></span></div>
      <div id="status">Hold your phone like a wand and point it at the screen.</div>
      <button type="button" id="connect">Connect</button>
      <div id="pad" hidden>
        <div class="big">👆</div>
        <div>Swipe to throw, or press and hold</div>
        <div id="speed"></div>
      </div>
      <div id="buttons" hidden>
        <button type="button" id="levels-btn" class="secondary">Levels</button>
        <button type="button" id="retry-btn" class="secondary">Retry</button>
        <button type="button" id="next-btn">Next level</button>
      </div>
      <button type="button" id="center" class="secondary" hidden>Recenter aim</button>
      <div id="hint">Tilt and turn the phone to aim. A faster swipe throws harder, or hold your finger down to charge.</div>
    </main>
    <div id="picker" hidden>
      <header>
        <h2>Pick a level</h2>
        <button type="button" id="picker-close" class="secondary" aria-label="Close">✕</button>
      </header>
      <div id="level-list"></div>
    </div>
    <script type="module" src="/src/controller.ts"></script>
  </body>
</html>
