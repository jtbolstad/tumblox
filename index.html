<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Blox Topple</title>
    <style>
      :root { --ink: #023047; --accent: #fb8500; --panel: rgba(255, 255, 255, 0.92); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8ecae6; font-family: system-ui, sans-serif; color: var(--ink); }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      button { font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
      button.secondary { background: #219ebc; }
      #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 600; pointer-events: none; }
      #hud button { pointer-events: auto; padding: 6px 12px; }
      #hud .goal { opacity: 0.8; }
      #hud .debug { font-weight: 400; opacity: 0.7; font-size: 0.85em; }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(2, 48, 71, 0.45); padding: 16px; box-sizing: border-box; }
      .overlay[hidden] { display: none; }
      .panel { background: var(--panel); border-radius: 16px; padding: 20px; max-width: 560px; width: 100%; max-height: 100%; overflow: auto; box-sizing: border-box; text-align: center; }
      .panel h1, .panel h2 { margin: 0 0 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
      .card { display: flex; flex-direction: column; gap: 4px; align-items: center; background: #fff; color: var(--ink); border: 2px solid #ccd; padding: 10px 6px; }
      .card .n { font-size: 1.4em; }
      .card .m { min-height: 1.2em; font-size: 0.85em; }
      .medal-gold { color: #d4a000; } .medal-silver { color: #8a94a0; } .medal-bronze { color: #b0663a; }
      .actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
      .popup { position: fixed; transform: translate(-50%, -50%); font-weight: 800; font-size: 1.6em; color: #fff; text-shadow: 0 2px 0 #fb8500, 0 0 6px rgba(0, 0, 0, 0.5); pointer-events: none; animation: popup-rise 1.1s ease-out forwards; }
      .popup.negative { text-shadow: 0 2px 0 #d81159, 0 0 6px rgba(0, 0, 0, 0.5); }
      @keyframes popup-rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }
      .big { font-size: 2.2em; margin: 4px 0; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <button type="button" id="menu-btn" class="secondary">Levels</button>
      <span id="level-name"></span>
      <span>Throws: <span id="throws">0</span></span>
      <span>Score: <span id="score">0</span></span>
      <span class="goal" id="goal"></span>
      <span class="debug">Power: <span id="tier">-</span> · Flick: <span id="flick">0</span> px/s</span>
    </div>
    <div id="menu" class="overlay">
      <div class="panel">
        <h1>Blox Topple</h1>
        <div id="level-grid" class="grid"></div>
      </div>
    </div>
    <div id="result" class="overlay" hidden>
      <div class="panel">
        <h2 id="result-title">Result</h2>
        <div class="big" id="result-medal"></div>
        <div id="result-detail"></div>
        <div class="actions">
          <button type="button" id="retry-btn">Retry</button>
          <button type="button" id="next-btn">Next level</button>
          <button type="button" id="levels-btn" class="secondary">Levels</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
