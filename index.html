<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Tumble Isle</title>
    <meta name="theme-color" content="#8ecae6" />
    <meta name="description" content="Throw, grab and blast blocks to solve short physics puzzles." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <style>
      :root { --ink: #023047; --accent: #fb8500; --panel: rgba(255, 255, 255, 0.92); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8ecae6; font-family: 'Fredoka Variable', system-ui, sans-serif; color: var(--ink); }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      button { font: inherit; font-weight: 700; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; }
      button.secondary { background: #219ebc; }
      #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-weight: 600; pointer-events: none; }
      #hud button { pointer-events: auto; padding: 6px 12px; }
      #hud > span:not(:empty) { background: rgba(255, 255, 255, 0.78); border-radius: 8px; padding: 3px 9px; } /* readable on dark night skies */
      #hud .goal { opacity: 0.8; }
      #hud .debug { display: none; font-weight: 400; opacity: 0.7; font-size: 0.85em; }
      body.dev #hud .debug { display: inline; }
      .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(2, 48, 71, 0.45); padding: 16px; box-sizing: border-box; }
      .overlay[hidden] { display: none; }
      .panel { background: var(--panel); border-radius: 16px; padding: 20px; max-width: 760px; width: 100%; max-height: 100%; overflow: auto; box-sizing: border-box; text-align: center; }
      .panel h1, .panel h2 { margin: 0 0 12px; }
      .worlds { display: flex; flex-direction: column; gap: 14px; text-align: left; }
      .world { border-radius: 14px; padding: 12px 14px 18px; background: linear-gradient(to bottom, var(--sky-top), var(--sky-horizon)); }
      .world header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; color: var(--title-ink); margin-bottom: 10px; }
      .world h2 { margin: 0; font-size: 1.3em; }
      .world .tally { font-weight: 600; font-size: 0.9em; }
      .isles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; }
      .isle { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 6px 10px; color: var(--isle-ink); background: var(--ground); border-radius: 18px 18px 42% 42% / 18px 18px 30% 30%; box-shadow: 0 7px 0 var(--earth), 0 10px 10px rgba(2, 48, 71, 0.2); }
      .isle:hover:not(:disabled) { transform: translateY(-2px); }
      .isle .n { font-size: 1.4em; line-height: 1.1; }
      .isle .name { font-size: 0.85em; font-weight: 600; }
      .isle .m { min-height: 1.2em; font-size: 0.8em; font-weight: 600; }
      .actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
      .popup { --pop: #fb8500; position: fixed; transform: translate(-50%, -50%); font-weight: 900; font-size: 2em; color: #fff; text-shadow: 0 3px 0 var(--pop), 0 0 8px rgba(0, 0, 0, 0.45); pointer-events: none; animation: popup-rise 1.2s ease-out forwards; }
      .popup.negative { --pop: #d81159; }
      @keyframes popup-rise {
        0% { opacity: 1; margin-top: 0; transform: translate(-50%, -50%) scale(0.4); }
        18% { transform: translate(-50%, -50%) scale(1.3); }
        32% { transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; margin-top: -70px; transform: translate(-50%, -50%) scale(1); }
      }
      #callout { position: fixed; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; color: #fff; }
      #callout .title { font-weight: 900; font-size: 3em; text-shadow: 0 4px 0 #e63946, 0 0 12px rgba(0, 0, 0, 0.4); }
      #callout .sub { font-weight: 800; font-size: 1.6em; text-shadow: 0 3px 0 #fb8500, 0 0 8px rgba(0, 0, 0, 0.4); }
      #callout.show { animation: callout 1.3s ease-out forwards; }
      @keyframes callout {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(-8deg); }
        15% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) rotate(3deg); }
        28% { transform: translate(-50%, -50%) scale(1) rotate(0); }
        75% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
      }
      button:focus-visible { outline: 3px solid #023047; outline-offset: 2px; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .chip { background: #fff; color: var(--ink); border: 2px solid #ccd; padding: 6px 12px; }
      .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
      #player-row { border: 0; padding: 0; margin: 0 0 12px; display: flex; gap: 8px; justify-content: center; }
      #party { display: flex; gap: 6px; }
      .player { background: var(--panel); border-radius: 8px; padding: 2px 8px; border: 2px solid transparent; }
      .player.active { border-color: var(--accent); }
      .player.out { text-decoration: line-through; opacity: 0.5; }
      #toast { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-weight: 800; font-size: 1.8em; color: #fff; text-shadow: 0 2px 0 var(--ink); pointer-events: none; opacity: 0; text-align: center; }
      #toast.show { animation: toast 1.6s ease-out forwards; }
      @keyframes toast { 0% { opacity: 0; } 12%, 70% { opacity: 1; } 100% { opacity: 0; } }
      #hint { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 16px); box-sizing: border-box; text-align: center; font-size: 0.8em; background: rgba(255, 255, 255, 0.7); border-radius: 8px; padding: 2px 10px; pointer-events: none; }
      @media (pointer: coarse) { #hint { display: none; } }
      @media (prefers-reduced-motion: reduce) { .popup, #toast.show, #callout.show, .drop, #banner, #banner.leaving { animation-duration: 0.01s; } }
      .ball-icon { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; margin-right: 3px; vertical-align: -0.05em; box-shadow: inset -2px -3px 0 rgba(0, 0, 0, 0.2), 0 1px 2px rgba(0, 0, 0, 0.3); }
      #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 24px 16px 40px; box-sizing: border-box; pointer-events: none; }
      #title[hidden] { display: none; }
      #title img { width: min(560px, 90vw); filter: drop-shadow(0 6px 8px rgba(2, 48, 71, 0.25)); }
      #title .tagline { margin: 6px 0 0; font-weight: 600; font-size: 1.15em; color: var(--ink); text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7); text-align: center; }
      @media (max-width: 700px) { #title { padding-top: 60px; } }
      #title .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }
      #title button { pointer-events: auto; font-size: 1.5em; padding: 14px 42px; border-radius: 16px; box-shadow: 0 5px 0 #c96a00; }
      #title .try { font-size: 0.9em; opacity: 0.75; }
      body.on-title #hud > :not(#mute-btn):not(#sound-btn):not(#quality-btn) { display: none; }
      .drop { animation: medal-drop 0.9s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
      @keyframes medal-drop {
        0% { opacity: 0; transform: translateY(-120px) rotate(-30deg) scale(0.6); }
        60% { opacity: 1; transform: translateY(0) rotate(8deg) scale(1.25); }
        100% { transform: translateY(0) rotate(0) scale(1); }
      }
      body.capture #hud, body.capture #title, body.capture #hint, body.capture #callout, body.capture .popup, body.capture #toast { display: none; }
      .about-link { align-self: center; color: var(--ink); font-weight: 600; }
      #sound-panel { position: fixed; top: 52px; left: 8px; z-index: 5; display: grid; gap: 8px; background: var(--panel); border-radius: 12px; padding: 12px 14px; font-weight: 600; box-shadow: 0 6px 16px rgba(2, 48, 71, 0.25); }
      #sound-panel[hidden] { display: none; }
      #sound-panel label { display: grid; grid-template-columns: 4.5em 1fr; align-items: center; gap: 10px; }
      #sound-panel input { width: 150px; accent-color: var(--accent); }
      #banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 32px)); box-sizing: border-box; text-align: center; background: var(--panel); border-radius: 18px; padding: 14px 20px 16px; box-shadow: 0 8px 24px rgba(2, 48, 71, 0.25); pointer-events: none; animation: banner-in 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) both; }
      #banner[hidden] { display: none; }
      @media (max-width: 700px) { #banner { top: 132px; } }
      body.capture #banner { display: none; }
      #banner.leaving { animation: banner-out 0.35s ease-in forwards; }
      #banner .title { font-weight: 800; font-size: 1.05em; color: var(--accent); letter-spacing: 0.02em; }
      #banner .goal { font-weight: 800; font-size: 1.55em; line-height: 1.15; margin: 4px 0 8px; }
      #banner .line { font-weight: 600; opacity: 0.85; line-height: 1.5; }
      @keyframes banner-in { from { opacity: 0; transform: translate(-50%, -30px) scale(0.85); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
      @keyframes banner-out { to { opacity: 0; transform: translate(-50%, -20px) scale(0.95); } }
      .big { font-size: 2.2em; margin: 4px 0; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <button type="button" id="menu-btn" class="secondary">Levels</button>
      <button type="button" id="mute-btn" class="secondary" aria-label="Toggle sound">🔊</button>
      <button type="button" id="sound-btn" class="secondary" aria-label="Sound settings" aria-expanded="false" aria-controls="sound-panel">🎚</button>
      <button type="button" id="quality-btn" class="secondary" aria-label="Graphics quality">High</button>
      <span id="level-name"></span>
      <span><span id="throws-label">Throws</span>: <span id="throws">0</span></span>
      <span>Score: <span id="score">0</span></span>
      <span class="goal" id="goal"></span>
      <span id="party"></span>
      <span class="debug">Power: <span id="tier">-</span> · Flick: <span id="flick">0</span> px/s</span>
    </div>
    <div id="menu" class="overlay" hidden>
      <div class="panel">
        <h1>Tumble Isle</h1>
        <fieldset id="player-row" aria-label="Number of players"></fieldset>
        <div id="level-grid" class="worlds"></div>
        <div class="actions"><button type="button" id="title-btn" class="secondary">Title screen</button><a class="about-link" href="./about.html">About</a></div>
      </div>
    </div>
    <div id="title" hidden>
      <div>
        <img src="./logo.svg" alt="Tumble Isle" />
        <p class="tagline">Throw, blast and pull blocks until the island tumbles.</p>
      </div>
      <div class="bottom">
        <button type="button" id="play-btn">Play</button>
        <div class="try">Go on, throw something at the title.</div>
      </div>
    </div>
    <div id="result" class="overlay" hidden>
      <div class="panel">
        <h2 id="result-title">Result</h2>
        <div class="big" id="result-medal"></div>
        <div id="result-detail"></div>
        <div class="actions">
          <button type="button" id="retry-btn">Retry</button>
          <button type="button" id="next-btn">Next level</button>
          <button type="button" id="levels-btn" class="secondary">Levels</button>
        </div>
      </div>
    </div>
    <div id="sound-panel" hidden>
      <label>Music <input type="range" min="0" max="100" data-channel="music" /></label>
      <label>Effects <input type="range" min="0" max="100" data-channel="effects" /></label>
      <label>Voices <input type="range" min="0" max="100" data-channel="voices" /></label>
    </div>
    <div id="banner" role="status" aria-live="polite" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="callout" aria-hidden="true"></div>
    <div id="hint">Touchpad: two-finger swipe to look around, pinch to zoom · Keys: arrows aim · hold Space to throw · Q/E orbit · Z/X zoom · R restart</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
